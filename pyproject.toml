[project]
name = "hovernet-loop-kit"
version = "1.5.0"
description = "HoverNet v1.5 open-source local agent loop kit"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
hovertools = "hovertools.public_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hovertools*"]
